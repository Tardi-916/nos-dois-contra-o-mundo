<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Convite Especial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            border: none;
            outline: none;
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            --text-color: #612340;
            --primary-color: #ff4d79;
            --yes-btn: #ff4d79; 
            --no-btn: #b3b3b3;  
            --card-bg: rgba(255, 255, 255, 0.85);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .hidden {
            display: none !important;
        }

        /* --- TELA 1 --- */
        #screen1 {
            justify-content: flex-start;
        }

        #screen1 .gif-imagem {
            position: absolute;
            top: 10%;
            max-width: 180px;
            border-radius: 15px;
            z-index: 2;
        }

        #screen1 h1 {
            position: absolute;
            top: 40%;
            text-align: center;
            width: 100%;
            font-size: 1.8rem;
            color: #ff4d79;
            padding: 0 20px;
        }

        #screen1 .btn-group {
            position: absolute;
            top: 75%;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 50px;
            z-index: 10;
        }

        /* --- TELA 2 --- */
        #screen2 {
            justify-content: center;
            align-items: center;
        }

        /* Estilo dos GIFs flutuantes do lado de fora */
        .side-gif {
            position: absolute;
            width: clamp(120px, 25vw, 220px); /* Ficam maiores que antes */
            border-radius: 15px;
            z-index: 0; /* Ficam atrás da caixa principal */
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .left-gif {
            left: 2%;
            top: 15%;
            transform: rotate(-10deg); /* Leve inclinação charmosinha */
        }

        .right-gif {
            right: 2%;
            bottom: 15%;
            transform: rotate(10deg);
        }

        .white-box {
            width: 90%;
            max-width: 400px;
            padding: 30px 25px;
            text-align: center;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 77, 121, 0.2);
            backdrop-filter: blur(5px);
            position: relative;
            z-index: 2; /* Garante que a caixa fique acima dos GIFs caso se toquem */
        }

        .white-box h2 {
            margin-bottom: 20px;
            font-size: 1.6rem;
            color: #ff4d79;
        }

        /* --- TELA 3 (Final) --- */
        #screen3 {
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        #screen3 .gif-imagem {
            max-width: 180px;
            border-radius: 15px;
            z-index: 2;
        }

        #screen3 h2 {
            font-size: 2rem;
            color: #ff4d79;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        #screen3 p {
            font-size: 1.2rem;
            font-weight: bold;
        }

        /* Botões */
        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #btn-yes {
            background-color: var(--yes-btn);
            color: white;
            transition: transform 0.3s ease;
            z-index: 5;
            position: relative;
        }

        #btn-no {
            background-color: var(--no-btn);
            color: white;
            transition: left 0.2s ease, top 0.2s ease, opacity 0.2s ease;
            z-index: 10;
        }

        /* Formulário */
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        label { font-weight: bold; font-size: 14px; }
        
        input, select {
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            color: #333;
            background-color: #fff9fa;
            transition: box-shadow 0.2s;
        }

        input:focus, select:focus {
            box-shadow: 0 0 0 2px var(--primary-color);
        }

        button[type="submit"] {
            background-color: var(--primary-color);
            color: white;
            margin-top: 15px;
            padding: 15px;
            font-size: 16px;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="just-the-two-of-us.mp3" loop preload="auto"></audio>

    <!-- TELA 1 -->
    <div id="screen1" class="container">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaGZjZWVxeG9qZnp4aXJ6b2h0eTN2M3A5Z3o0Ynp6b2g3Y3E0b2hxeiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26BRv0ThflsHCqDrG/giphy.gif" alt="Ursinho fofo" class="gif-imagem">
        
        <h1>Você aceita sair comigo?</h1>
        
        <div class="btn-group">
            <button id="btn-yes">Sim!</button>
            <button id="btn-no">Não</button>
        </div>
    </div>

    <!-- TELA 2 -->
    <div id="screen2" class="container hidden">
        <!-- GIF Esquerda flutuante -->
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjR6cTVpd3AwcXh6MXIzeWV4MWo3dDhyc2ZzZ281aHA0MGY0ZmhkYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/VbnUQpnihPSIgIXuZv/giphy.gif" alt="Gatinho 1" class="side-gif left-gif">
        
        <div class="white-box">
            <h2>Perfeito! Escolha os detalhes:</h2>
            
            <form id="date-form">
                <label for="data">Qual dia?</label>
                <input type="date" id="data" name="Data_Escolhida" required>

                <label for="hora">Que horas?</label>
                <input type="time" id="hora" name="Hora_Escolhida" required>

                <label for="local">Onde vamos?</label>
                <select id="local" name="Local_Escolhido" required>
                    <option value="" disabled selected>Selecione uma opção...</option>
                    <option value="Jantar Romântico">Jantar Romântico</option>
                    <option value="Cinema">Cinema</option>
                    <option value="Caminhada">Caminhada</option>
                    <option value="Tomar um Sorvete">Tomar um Sorvete</option>
                    <option value="Surpresa (Você escolhe)">Surpresa (Deixa comigo)</option>
                </select>
                <button type="submit" id="btn-submit">Confirmar Encontro</button>
            </form>
        </div>

        <!-- GIF Direita flutuante -->
        <img src="https://media.giphy.com/media/13CoXDiaCcCoyk/giphy.gif" alt="Gatinho 2" class="side-gif right-gif">
    </div>

    <!-- TELA 3 -->
    <div id="screen3" class="container hidden">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcG8zcHV5bW84cGkxeThqb2hxd2h6M2h2czB1eGk2NzN2aG83Y3E5dCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif" alt="Gato feliz" class="gif-imagem">
        <h2>Tudo certo!</h2>
        <p>Já recebi os detalhes aqui. Mal posso esperar! ❤️</p>
    </div>

    <script>
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const screen3 = document.getElementById('screen3');
        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');
        const dateForm = document.getElementById('date-form');
        const bgMusic = document.getElementById('bg-music');
        const btnSubmit = document.getElementById('btn-submit');

        document.body.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play().catch(() => console.log("Aguardando interação."));
            }
        }, { once: true });
        
        document.body.addEventListener('touchstart', () => {
            if (bgMusic.paused) {
                bgMusic.play().catch(() => console.log("Aguardando interação."));
            }
        }, { once: true });

        let yesScale = 1;
        const maxScale = 7; 
        let isTeleporting = false; 

        const teleportButton = (e) => {
            e.preventDefault(); 
            
            if (isTeleporting) return;
            isTeleporting = true;
            
            if (yesScale < maxScale) {
                yesScale += 1.5; 
                if (yesScale > maxScale) yesScale = maxScale;
                btnYes.style.transform = `scale(${yesScale})`;
            }

            btnNo.style.opacity = '0';
            btnNo.style.pointerEvents = 'none'; 

            setTimeout(() => {
                if (btnNo.style.position !== 'fixed') {
                    btnNo.style.position = 'fixed';
                }

                const margin = 30; 
                const maxX = window.innerWidth - btnNo.offsetWidth - margin;
                const maxY = window.innerHeight - btnNo.offsetHeight - margin;

                const randomX = Math.max(margin, Math.floor(Math.random() * maxX));
                const randomY = Math.max(margin, Math.floor(Math.random() * maxY));

                btnNo.style.left = `${randomX}px`;
                btnNo.style.top = `${randomY}px`;
                
                btnNo.style.opacity = '1';
                btnNo.style.pointerEvents = 'auto';
                
                isTeleporting = false;
            }, 250); 
        };

        btnNo.addEventListener('click', teleportButton);
        btnNo.addEventListener('touchstart', teleportButton);

        btnYes.addEventListener('click', () => {
            bgMusic.play().catch(err => console.log("Áudio bloqueado pelo navegador."));
            screen1.classList.add('hidden');
            screen2.classList.remove('hidden');
        });

        dateForm.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            btnSubmit.innerText = "Enviando...";
            btnSubmit.disabled = true;

            const formData = new FormData(dateForm);

            try {
                const formspreeURL = "https://formspree.io/f/mwlkynng"; 

                const response = await fetch(formspreeURL, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    screen2.classList.add('hidden');
                    screen3.classList.remove('hidden');
                } else {
                    alert("Ops! Houve um problema ao enviar. Mas o encontro tá de pé, me manda mensagem!");
                    btnSubmit.innerText = "Confirmar Encontro";
                    btnSubmit.disabled = false;
                }
            } catch (error) {
                alert("Erro de conexão. Me mande os detalhes pelo WhatsApp!");
            }
        });
    </script>
</body>
</html>
