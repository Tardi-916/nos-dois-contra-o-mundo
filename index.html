<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Um Convite Especial</title>
    <style>
        /* Ambientação Romântica */
        :root {
            /* Fundo com gradiente suave em tons de rosa e pêssego */
            --bg-gradient: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            --text-color: #612340;
            --primary-color: #ff4d79;
            --yes-btn: #ff4d79; /* Rosa vibrante */
            --no-btn: #b3b3b3;  /* Cinza neutro */
            --card-bg: rgba(255, 255, 255, 0.85);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Efeito de cartão elegante */
        .container {
            width: 90%;
            max-width: 400px;
            padding: 30px 25px;
            text-align: center;
            box-sizing: border-box;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 77, 121, 0.2);
            backdrop-filter: blur(5px);
            z-index: 1;
        }

        .hidden {
            display: none !important;
        }

        img.gif-imagem {
            max-width: 180px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        h1, h2 {
            margin-bottom: 20px;
            font-size: 1.6rem;
            color: #ff4d79;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #btn-yes {
            background-color: var(--yes-btn);
            color: white;
            transition: transform 0.3s ease;
            z-index: 5;
        }

        #btn-no {
            background-color: var(--no-btn);
            color: white;
            transition: left 0.2s ease, top 0.2s ease, opacity 0.2s ease;
            z-index: 10;
        }

        /* Estilo do Formulário */
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        label { font-weight: bold; font-size: 14px; }
        
        input, select {
            padding: 12px;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            color: #333;
            background-color: #fff9fa;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
        }

        button[type="submit"] {
            background-color: var(--primary-color);
            color: white;
            margin-top: 15px;
            padding: 15px;
            font-size: 16px;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="just-the-two-of-us.mpeg" loop preload="auto"></audio>

    <!-- TELA 1 -->
    <div id="screen1" class="container">
        <!-- GIF Incial -->
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaGZjZWVxeG9qZnp4aXJ6b2h0eTN2M3A5Z3o0Ynp6b2g3Y3E0b2hxeiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26BRv0ThflsHCqDrG/giphy.gif" alt="Ursinho fofo" class="gif-imagem">
        
        <h1>Você aceita sair comigo?</h1>
        
        <div class="btn-group">
            <button id="btn-yes">Sim!</button>
            <button id="btn-no">Não</button>
        </div>
    </div>

    <!-- TELA 2 -->
    <div id="screen2" class="container hidden">
        <!-- GIF Gatinho Fofo -->
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjR6cTVpd3AwcXh6MXIzeWV4MWo3dDhyc2ZzZ281aHA0MGY0ZmhkYiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/VbnUQpnihPSIgIXuZv/giphy.gif" alt="Gatinho fofo" class="gif-imagem">
        
        <h2>Perfeito! Escolha os detalhes:</h2>
        
        <form id="date-form">
            <label for="data">Qual dia?</label>
            <input type="date" id="data" name="Data_Escolhida" required>

            <label for="hora">Que horas?</label>
            <input type="time" id="hora" name="Hora_Escolhida" required>

            <label for="local">Onde vamos?</label>
            <select id="local" name="Local_Escolhido" required>
                <option value="" disabled selected>Selecione uma opção...</option>
                <option value="Jantar Romântico">Jantar Romântico</option>
                <option value="Cinema">Cinema</option>
                <option value="Caminhada">Caminhada</option> <!-- Opção alterada -->
                <option value="Tomar um Sorvete">Tomar um Sorvete</option>
                <option value="Surpresa (Você escolhe)">Surpresa (Deixa comigo)</option>
            </select>
            <button type="submit" id="btn-submit">Confirmar Encontro</button>
        </form>
    </div>

    <!-- TELA 3 -->
    <div id="screen3" class="container hidden">
        <!-- GIF Finalização -->
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcG8zcHV5bW84cGkxeThqb2hxd2h6M2h2czB1eGk2NzN2aG83Y3E5dCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif" alt="Gato feliz" class="gif-imagem">
        <h2>Tudo certo!</h2>
        <p>Já recebi os detalhes aqui. Mal posso esperar! ❤️</p>
    </div>

    <script>
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const screen3 = document.getElementById('screen3');
        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');
        const dateForm = document.getElementById('date-form');
        const bgMusic = document.getElementById('bg-music');
        const btnSubmit = document.getElementById('btn-submit');

        let yesScale = 1;

        const teleportButton = (e) => {
            e.preventDefault(); 
            
            yesScale += 0.3; 
            btnYes.style.transform = `scale(${yesScale})`;

            btnNo.style.opacity = '0';
            btnNo.style.pointerEvents = 'none'; 

            setTimeout(() => {
                if (btnNo.style.position !== 'fixed') {
                    btnNo.style.position = 'fixed';
                }

                const margin = 30; 
                
                const maxX = window.innerWidth - btnNo.offsetWidth - margin;
                const maxY = window.innerHeight - btnNo.offsetHeight - margin;

                const randomX = Math.max(margin, Math.floor(Math.random() * maxX));
                const randomY = Math.max(margin, Math.floor(Math.random() * maxY));

                btnNo.style.left = `${randomX}px`;
                btnNo.style.top = `${randomY}px`;
                
                btnNo.style.opacity = '1';
                btnNo.style.pointerEvents = 'auto';
            }, 200); 
        };

        btnNo.addEventListener('click', teleportButton);
        btnNo.addEventListener('touchstart', teleportButton);

        btnYes.addEventListener('click', () => {
            bgMusic.play().catch(err => console.log("Áudio bloqueado pelo navegador."));
            screen1.classList.add('hidden');
            screen2.classList.remove('hidden');
        });

        dateForm.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            btnSubmit.innerText = "Enviando...";
            btnSubmit.disabled = true;

            const formData = new FormData(dateForm);

            try {
                // INSIRA SUA URL DO FORMSPREE AQUI
                const formspreeURL = "https://formspree.io/f/mwlkynng"; 

                const response = await fetch(formspreeURL, {
                    method: 'POST',
                    body: formData,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    screen2.classList.add('hidden');
                    screen3.classList.remove('hidden');
                } else {
                    alert("Ops! Houve um problema ao enviar. Mas o encontro tá de pé, me manda mensagem!");
                    btnSubmit.innerText = "Confirmar Encontro";
                    btnSubmit.disabled = false;
                }
            } catch (error) {
                alert("Erro de conexão. Me mande os detalhes pelo WhatsApp!");
            }
        });
    </script>
</body>
</html>
